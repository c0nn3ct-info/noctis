name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 24, not 20, because of what it bundles: npm 11, which is the npm that
      # writes site/package-lock.json. npm 10 refuses to install it — it wants
      # `@emnapi/core` and `@emnapi/runtime` hoisted, where npm 11 leaves them
      # under the `@oxc-*` wasm bindings that ask for them, and `npm ci` stops
      # at "can only install packages when your package.json and
      # package-lock.json are in sync". The runner also stopped warning that
      # puppeteer, which the prerender drives, asks for node >= 22.12.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    needs: build
    # Deploy only from main; branch builds (e.g. workflow_dispatch on a staging
    # branch) still produce an inspectable artifact but never publish to Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
