<!doctype html>
<html lang="en" data-accent="planet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Run your own VLESS, Trojan, Shadowsocks, Hysteria2 and WireGuard servers from your browser. Paste a link and Noctis starts the engine that server needs."
    />
    <meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfbfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://chrome.google.com" />
    <link rel="preconnect" href="https://github.com" />
    <title>Noctis — proxy client for sing-box, xray & mihomo</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('noctis-locale')) return;
          var l = (navigator.language || '').toLowerCase();
          var loc = 'en';
          if (l.indexOf('ru') === 0) loc = 'ru';
          else if (l.indexOf('es') === 0) loc = 'es';
          else if (l.indexOf('zh') === 0) loc = 'zh-CN';
          else if (l.indexOf('fa') === 0 || l.indexOf('pe') === 0) loc = 'fa';
          else if (l.indexOf('ar') === 0) loc = 'ar';
          localStorage.setItem('noctis-locale', loc);
          if (loc !== 'en') {
            var p = location.pathname;
            location.replace('/' + loc + (p === '/' ? '/' : p) + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/entries/home.tsx"></script>
  </body>
</html>
